name: Cleanup Zone 17

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v1.0

      - name: Remove obsolete Zone 17 files
        shell: bash
        run: |
          cd "docs/SYSTEM ZONES/17-razvoj-i-globalna-implementacija"

          rm -f \
            "171-upravljanje-razvojem-i-implementacijom.md" \
            "172-strategija-globalne-implementacije.md" \
            "173-faze-i-modeli-implementacije.md" \
            "174-pilot-programi-i-testiranje.md" \
            "175-lokalna-i-regionalna-prilagodba.md" \
            "176-medunarodno-sirenje-sustava.md" \
            "177-integracija-zona-i-sustava.md" \
            "178-mjerenje-rezultata-implementacije.md" \
            "179-skaliranje-i-dugorocna-odrzivost.md" \
            "1710-buduci-razvoj-i-globalna-evolucija.md"

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Finalize Zone 17 canonical documentation"
          git push origin HEAD:v1.0
