name: Zone 03 Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-zone03:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Zone 03 canonical structure
        shell: bash
        run: |
          set -euo pipefail

          ZONE_DIR="docs/SYSTEM ZONES/03-institucijska-i-upravna-zona"

          echo "========================================"
          echo "IMPERIOR — ZONE 03 VALIDATION"
          echo "========================================"
          echo

          if [ ! -d "$ZONE_DIR" ]; then
            echo "ERROR: Zone 03 directory does not exist."
            exit 1
          fi

          cd "$ZONE_DIR"

          echo "Checking canonical manifest..."

          if [ ! -f "ZONE03-CANONICAL-MANIFEST.md" ]; then
            echo "ERROR: ZONE03-CANONICAL-MANIFEST.md is missing."
            exit 1
          fi

          echo "OK: Canonical manifest exists."
          echo

          canonical_files=(
            "imp-03-01-01-temeljni-akt-sredisnje-uprave.md"
            "imp-03-01-02-organizacijska-struktura-sredisnje-uprave.md"
            "imp-03-01-03-poslovnik-sredisnje-uprave.md"

            "imp-03-02-01-okvir-institucionalnog-sustava.md"
            "imp-03-02-02-standard-osnivanja-institucija.md"
            "imp-03-02-03-registar-institucija.md"

            "imp-03-03-01-okvir-agencijskog-sustava.md"
            "imp-03-03-02-standard-rada-agencija.md"
            "imp-03-03-03-registar-agencija.md"

            "imp-03-04-01-okvir-sustava-zavoda.md"
            "imp-03-04-02-standard-rada-zavoda.md"
            "imp-03-04-03-registar-zavoda.md"

            "imp-03-05-01-okvir-sustava-centara.md"
            "imp-03-05-02-standard-rada-centara.md"
            "imp-03-05-03-registar-centara.md"

            "imp-03-06-01-okvir-regionalne-uprave.md"
            "imp-03-06-02-standard-regionalnih-nadleznosti.md"
            "imp-03-06-03-koordinacija-regionalne-uprave.md"

            "imp-03-07-01-okvir-lokalne-uprave.md"
            "imp-03-07-02-standard-lokalnih-nadleznosti.md"
            "imp-03-07-03-koordinacija-lokalne-uprave.md"

            "imp-03-08-01-temeljni-koordinacijski-okvir.md"
            "imp-03-08-02-protokol-meuinstitucionalne-koordinacije.md"
            "imp-03-08-03-evidencija-koordinacijskih-odluka.md"
          )

          missing=0

          echo "Checking 24 canonical documents..."
          echo

          for file in "${canonical_files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              missing=$((missing + 1))
            fi
          done

          echo
          echo "----------------------------------------"
          echo "Canonical document count"
          echo "----------------------------------------"

          actual_count=$(find . -maxdepth 1 -type f -name 'imp-03-*.md' | wc -l | tr -d ' ')

          echo "Expected canonical documents: 24"
          echo "Actual IMP-03 documents: $actual_count"

          if [ "$missing" -ne 0 ]; then
            echo
            echo "ERROR: $missing canonical document(s) are missing."
            exit 1
          fi

          if [ "$actual_count" -ne 24 ]; then
            echo
            echo "WARNING: Expected exactly 24 IMP-03 documents, but found $actual_count."
            echo "Additional IMP-03 documents may require review."
          else
            echo "OK: Canonical document count is exactly 24."
          fi

          echo
          echo "----------------------------------------"
          echo "Cross-zone contamination check"
          echo "----------------------------------------"

          foreign_files=$(find . -maxdepth 1 -type f -name 'imp-*.md' ! -name 'imp-03-*.md' -print)

          if [ -n "$foreign_files" ]; then
            echo "WARNING: Foreign IMP documents detected in Zone 03:"
            echo "$foreign_files"
          else
            echo "OK: No foreign IMP-zone documents detected."
          fi

          echo
          echo "----------------------------------------"
          echo "Duplicate canonical code check"
          echo "----------------------------------------"

          duplicate_codes=$(
            find . -maxdepth 1 -type f -name 'imp-03-*.md' \
            | sed -E 's#^\./(imp-03-[0-9]{2}-[0-9]{2}).*#\1#' \
            | sort \
            | uniq -d
          )

          if [ -n "$duplicate_codes" ]; then
            echo "ERROR: Duplicate canonical document codes detected:"
            echo "$duplicate_codes"
            exit 1
          else
            echo "OK: No duplicate canonical document codes detected."
          fi

          echo
          echo "----------------------------------------"
          echo "Navigation files check"
          echo "----------------------------------------"

          navigation_files=(
            "031-sredisnja-uprava.md"
            "032-institucije.md"
            "033-agencije.md"
            "034-zavodi.md"
            "035-centri.md"
            "036-regionalna-uprava.md"
            "037-lokalna-uprava.md"
            "038-sustav-koordinacije.md"
            "_order.yaml"
            "index.md"
          )

          nav_missing=0

          for file in "${navigation_files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "WARNING: Missing supporting file: $file"
              nav_missing=$((nav_missing + 1))
            fi
          done

          echo
          echo "========================================"
          echo "ZONE 03 VALIDATION SUMMARY"
          echo "========================================"
          echo "Canonical documents expected: 24"
          echo "Canonical documents missing: $missing"
          echo "IMP-03 files found: $actual_count"
          echo "Supporting files missing: $nav_missing"

          if [ "$missing" -eq 0 ]; then
            echo
            echo "RESULT: ZONE 03 CANONICAL DOCUMENTATION PASSED VALIDATION."
          fi
